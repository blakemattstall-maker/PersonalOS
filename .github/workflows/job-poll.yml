# The internship poller's clock.
#
# Vercel's free crons fire once a day, and a daily check is useless for the
# one thing this feature is for: applying the day a posting goes live, ideally
# within the hour. GitHub Actions schedules are free and unlimited on a public
# repository, so the schedule lives here and simply rings Almanac's own cron
# endpoint — all the logic stays in the app (web/tools/jobs.js).
#
# GitHub queues scheduled workflows and can run them several minutes late under
# load, which is fine at this cadence: worst case a posting is found ~20
# minutes after it appears instead of ~15.
#
# Setup (one time): repo Settings -> Secrets and variables -> Actions ->
# New repository secret, named CRON_SECRET, holding the same value as the
# CRON_SECRET environment variable on the Vercel project.

name: Poll job boards

on:
  schedule:
    # A CANARY, not the poller.
    #
    # docs/cron-jobs.sql schedules this exact URL on pg_cron every 15 minutes
    # and keeps time to the second. This workflow was the original scheduler and
    # kept running alongside it, so checkJobs — the most expensive invocation in
    # the system, 182 boards and an 11 MB dataset — was being run twice for the
    # same result. GitHub throttles a */15 schedule on a free public repo down to
    # roughly 18-30 runs a day anyway, which is precisely the unreliability
    # pg_cron was adopted to escape.
    #
    # Kept rather than deleted, because `test "$code" = "200"` below is the only
    # alarm anywhere that fires from OUTSIDE the app when the poller stops
    # answering. Deleting it would be the silent-degradation version of this cut.
    # Four times a day is enough for a liveness check and costs almost nothing.
    - cron: "17 */6 * * *"
  # So a run can be forced from the Actions tab while testing.
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every watched board for new postings
        run: |
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.getalmanac.xyz/api/cron/checkJobs")
          echo "HTTP $code"
          cat /tmp/out.json
          # A failed poll must fail the workflow, or a broken endpoint would
          # look like a quiet hiring market for weeks.
          test "$code" = "200"
